name: Docker and K8s checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          config: .hadolint.yaml

  kube-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stackrox/kube-linter-action@v1.0.5
        with:
          directory: k8s
          config: .kube-linter.yaml

  trivy-k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: k8s
          skip-dirs: tests-k8s
          severity: HIGH,CRITICAL
          exit-code: "1"

  kind-e2e:
    runs-on: ubuntu-latest
    needs: [hadolint, kube-linter, trivy-k8s]
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - name: Build and load image
        run: |
          docker build -t devsecops-demo:local app
          kind load docker-image devsecops-demo:local --name ci
      - name: Deploy
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/serviceaccount.yaml -f k8s/deployment.yaml -f k8s/service.yaml
          kubectl -n secure-app rollout status deploy/demo-app --timeout=120s
      - name: Policy negative tests
        run: ./scripts/test-policies.sh
