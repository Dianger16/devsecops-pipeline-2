name: Docker and K8s checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: app/Dockerfile
          config: .hadolint.yaml

  kube-linter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: stackrox/kube-linter-action@5792edc6a03735d592b13c08201711327a935735 # v1.0.5
        with:
          directory: k8s
          config: .kube-linter.yaml

  trivy-k8s:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: k8s
          skip-dirs: tests-k8s
          severity: HIGH,CRITICAL
          exit-code: "1"

  kind-e2e:
    runs-on: ubuntu-24.04
    needs: [hadolint, kube-linter, trivy-k8s]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: ci
      - name: Build and load image
        run: |
          docker build -t devsecops-demo:local app
          kind load docker-image devsecops-demo:local --name ci
      - name: Deploy
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/serviceaccount.yaml -f k8s/deployment.yaml -f k8s/service.yaml
          kubectl -n secure-app rollout status deploy/demo-app --timeout=120s
      - name: Policy negative tests
        run: ./scripts/test-policies.sh
