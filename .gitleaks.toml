title = "devsecops-pipeline gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key-assignment"
description = "Hardcoded API key / secret assignment"
regex = '''(?i)(api[_-]?key|secret|token|passwd|password)\s*[:=]\s*['"][A-Za-z0-9\/+=_\-]{16,}['"]'''
tags = ["custom"]

[allowlist]
paths = ['''\.gitleaks\.toml$''', '''README\.md$''']
